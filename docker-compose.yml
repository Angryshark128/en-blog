# en-blog —— 英文博客静态托管（usa /opt/en-blog）
# 构建产物 public/ 挂载进 nginx，内部 8091 由 my-nginx 反代（TLS 统一在 my-nginx，本容器不对外）
name: en-blog

services:
  blog:
    image: nginx:1.27-alpine
    container_name: en-blog
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/static.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M