<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 196" role="img" aria-label="The consistency spectrum, from linearizable to eventual">
  <rect x="0" y="0" width="720" height="196" fill="#ffffff"/>
  <title>The consistency spectrum, from linearizable to eventual</title>
  <g stroke-linejoin="round">
  <line x1="60.0" y1="104.0" x2="651.0" y2="104.0" stroke="#1e1e1e" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M660.0,104.0 L651.0,107.6 L651.0,100.4 Z" fill="#1e1e1e" fill-opacity="0.45"/>
  <line x1="60" y1="95" x2="60" y2="113" stroke="#1e1e1e" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <text x="60" y="84" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="start">Linearizable</text>
  <line x1="250" y1="95" x2="250" y2="113" stroke="#1e1e1e" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <text x="250" y="84" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle">Sequential</text>
  <line x1="440" y1="95" x2="440" y2="113" stroke="#1e1e1e" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <text x="440" y="84" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle">Causal</text>
  <line x1="630" y1="95" x2="630" y2="113" stroke="#1e1e1e" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round"/>
  <text x="630" y="84" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="end">Eventual</text>
  <line x1="630.0" y1="152.0" x2="69.0" y2="152.0" stroke="#1e1e1e" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M60.0,152.0 L69.0,148.4 L69.0,155.6 Z" fill="#1e1e1e" fill-opacity="0.35"/>
  <text x="60" y="178" font-size="12" fill="#1e1e1e" fill-opacity="0.55" text-anchor="start">more coordination, higher latency</text>
  <text x="630" y="178" font-size="12" fill="#1e1e1e" fill-opacity="0.55" text-anchor="end">more availability</text>
  </g>
</svg>
