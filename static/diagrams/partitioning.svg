<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-label="Key-range versus hash partitioning of the same keys">
  <rect x="0" y="0" width="720" height="236" fill="#ffffff"/>
  <title>Key-range versus hash partitioning of the same keys</title>
  <g stroke-linejoin="round">
  <text x="24" y="62" font-size="14" fill="#1e1e1e" fill-opacity="0.9" text-anchor="start" font-weight="600">key range</text>
  <rect x="150.0" y="40" width="176.0" height="40" rx="8" fill="none" stroke="#1e1e1e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="238.0" y="65" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle">A–F</text>
  <rect x="332.0" y="40" width="176.0" height="40" rx="8" fill="none" stroke="#1e1e1e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="420.0" y="65" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle">G–M</text>
  <rect x="514.0" y="40" width="176.0" height="40" rx="8" fill="none" stroke="#1e1e1e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="602.0" y="65" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle">N–Z</text>
  <text x="150" y="106" font-size="12" fill="#1e1e1e" fill-opacity="0.6" text-anchor="start">adjacent keys stay together, so a range scan reads one shard</text>
  <text x="24" y="176" font-size="14" fill="#1e1e1e" fill-opacity="0.9" text-anchor="start" font-weight="600">hash</text>
  <rect x="150.0" y="154" width="176.0" height="40" rx="8" fill="none" stroke="#1e1e1e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="184.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1</text>
  <text x="238.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4</text>
  <text x="292.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">7</text>
  <rect x="332.0" y="154" width="176.0" height="40" rx="8" fill="none" stroke="#1e1e1e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="366.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2</text>
  <text x="420.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">5</text>
  <text x="474.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">8</text>
  <rect x="514.0" y="154" width="176.0" height="40" rx="8" fill="none" stroke="#1e1e1e" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="548.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3</text>
  <text x="602.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">6</text>
  <text x="656.0" y="179" font-size="13" fill="#1e1e1e" fill-opacity="0.9" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">9</text>
  <text x="150" y="220" font-size="12" fill="#1e1e1e" fill-opacity="0.6" text-anchor="start">the same keys scatter, so a range scan hits every shard</text>
  </g>
</svg>
