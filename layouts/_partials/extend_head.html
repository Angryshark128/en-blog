{{- /* Diagram styles, injected only on pages that actually use the shortcode.
       The SVG inherits currentColor, so it follows PaperMod's light/dark theme. */ -}}
{{- if .HasShortcode "diagram" }}
<style>
  .diagram {
    margin: 28px 0 32px;
    overflow-x: auto;
  }
  .diagram svg {
    display: block;
    width: 100%;
    min-width: 460px;
    height: auto;
    color: var(--content);
  }
  .diagram figcaption {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    color: var(--secondary);
  }
</style>
{{- end }}
